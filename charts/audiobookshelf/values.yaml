controllers:
  main:
    containers:
      main:
        image:
          repository: ghcr.io/advplyr/audiobookshelf
          tag: 2.36.0
          pullPolicy: IfNotPresent
        env: []
        resources:
          requests:
            cpu: 100m
            memory: 128Mi

service:
  main:
    controller: main
    ports:
      http:
        port: 80

persistence:
  config-longhorn:
    enabled: true
    globalMounts:
      - path: /config
    type: persistentVolumeClaim
    storageClass: "longhorn"
    accessMode: ReadWriteOnce
    size: 1Gi
  metadata-longhorn:
    enabled: true
    globalMounts:
      - path: /metadata
    type: persistentVolumeClaim
    storageClass: "longhorn"
    accessMode: ReadWriteOnce
    size: 5Gi
  audiobooks-longhorn:
    enabled: true
    globalMounts:
      - path: /audiobooks
    type: persistentVolumeClaim
    storageClass: "longhorn"
    accessMode: ReadWriteOnce
    size: 300Gi
  podcasts-longhorn:
    enabled: true
    globalMounts:
      - path: /podcasts
    type: persistentVolumeClaim
    storageClass: "longhorn"
    accessMode: ReadWriteOnce
    size: 200Gi

defaultPodOptions:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 1
          preference:
            matchExpressions:
              - key: kubernetes.io/role
                operator: In
                values:
                  - worker

ingress:
  main:
    hosts:
      - host: audiobookshelf.cluster.diluz.io
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http
