celeryband:
  secrets:
    app-env:
      enabled: true
      forceRename: app-env
      stringData:
        NUXT_SESSION_PASSWORD: TODO_PROVIDE_A_SECURE_SECRET
        OBFUSCATION_SALT: TODO_PROVIDE_A_SECURE_SALT
        SMTP_HOST: smtp.servivum.com
        SMTP_PORT: "587"
        SMTP_USERNAME: TODO_PROVIDE_SMTP_USERNAME
        SMTP_PASSWORD: TODO_PROVIDE_SMTP_PASSWORD

  configMaps:
    config:
      enabled: true
      forceRename: app-config
      data:
        config.yaml: |
          serverUrl: "https://liqid.celery.band"
          acceptedDomain: "liqid.de"
          currency: "€"
          disclaimer: "This platform was not created on behalf of LIQID Investments or any of its affiliates. All content is based on publicly available or voluntarily provided information and is intended solely for the independent promotion of transparency."
          departments:
            tech:
              label: "Tech & Product"
              roles:
                - software_engineer
                - engineering_manager
                - product_manager
                - designer
                - operations
          roles:
            software_engineer:
              label: "Software Engineer"
              seniorityLevels:
                - junior
                - professional
                - senior
                - staff
                - principal
            engineering_manager:
              label: "Engineering Manager"
              seniorityLevels:
                - lead
                - manager
                - head_of
            product_manager:
              label: "Product Manager"
              seniorityLevels:
                - junior
                - professional
                - senior
            designer:
              label: "Designer"
              seniorityLevels:
                - junior
                - professional
                - senior
            operations:
              label: "Product Operations"
              seniorityLevels:
                - junior
                - professional
                - senior
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/maybeanerd/celeryband
            tag: 0.4.2
            pullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: app-env
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 512Mi

  service:
    main:
      controller: main
      ports:
        http:
          port: 3000

  persistence:
    data-longhorn:
      suffix: data-longhorn
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      storageClass: "longhorn"
      size: 1Gi
      globalMounts:
        - path: /app/data
    config:
      enabled: true
      type: configMap
      name: app-config
      globalMounts:
        - path: /app/config.yaml
          subPath: config.yaml
          readOnly: true

  ingress:
    main:
      enabled: true
      hosts:
        - host: liqid.celery.band
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
