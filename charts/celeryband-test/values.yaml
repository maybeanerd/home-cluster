celeryband:
  secrets:
    app-env:
      enabled: true
      stringData:
        NUXT_SESSION_PASSWORD: TODO_PROVIDE_A_SECURE_SECRET
        OBFUSCATION_SALT: TODO_PROVIDE_A_SECURE_SALT
        SMTP_USERNAME: TODO_PROVIDE_SMTP_USERNAME
        SMTP_PASSWORD: TODO_PROVIDE_SMTP_PASSWORD

  configMaps:
    config:
      enabled: true
      data:
        config.yaml: |
          serverUrl: "https://test.celery.band"
          acceptedDomain: "gmail.com"
          currency: "€"
          disclaimer: "This platform was not created on behalf of Google or any of its affiliates. All content is based on publicly available or voluntarily provided information and is intended solely for the independent promotion of transparency."
          departments:
            Engineering:
              roles:
                Software Engineer:
                  seniorityLevels:
                    - junior
                    - professional
                    - senior
                    - staff
                    - principal
                Engineering Manager:
                  seniorityLevels:
                    - lead
                    - head
                    - director
            Product:
              roles:
                Product Manager:
                  seniorityLevels:
                    - junior
                    - professional
                    - senior
                    - staff
                    - principal
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/maybeanerd/celeryband
            tag: 0.3.0
            pullPolicy: IfNotPresent
          env:
            NUXT_SESSION_PASSWORD:
              secretKeyRef:
                name: {{ include "celeryband.fullname" . }}-app-env
                key: NUXT_SESSION_PASSWORD
            OBFUSCATION_SALT:
              secretKeyRef:
                name: {{ include "celeryband.fullname" . }}-app-env
                key: OBFUSCATION_SALT
            SMTP_USERNAME:
              secretKeyRef:
                name: {{ include "celeryband.fullname" . }}-app-env
                key: SMTP_USERNAME
            SMTP_PASSWORD:
              secretKeyRef:
                name: {{ include "celeryband.fullname" . }}-app-env
                key: SMTP_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 512Mi

  service:
    main:
      controller: main
      ports:
        http:
          port: 3000

  persistence:
    data-longhorn:
      suffix: data-longhorn
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      storageClass: "longhorn"
      size: 1Gi
      globalMounts:
        - path: /app/data
    config:
      enabled: true
      type: configMap
      name: {{ include "celeryband.fullname" . }}-config
      globalMounts:
        - path: /app/config.yaml
          subPath: config.yaml
          readOnly: true

  ingress:
    main:
      enabled: true
      hosts:
        - host: test.celery.band
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
        - host: celery.band
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
