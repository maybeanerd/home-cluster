---
{{- include "bjw-s.common.loader.init" . }}

{{- define "celeryband-test.hardcodedValues" -}}
# Set the nameOverride based on the release name if no override has been set
{{ if not .Values.global.nameOverride }}
global:
  nameOverride: "{{ .Release.Name }}"
{{ end }}
{{- end -}}
{{- $_ := mergeOverwrite .Values (include "celeryband-test.hardcodedValues" . | fromYaml) -}}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bjw-s.common.names.fullname" . }}-config
  labels:
    {{- include "bjw-s.common.labels.default" . | nindent 4 }}
data:
  config.yaml: |
    serverUrl: {{ .Values.config.serverUrl | quote }}
    acceptedDomain: {{ .Values.config.acceptedDomain | quote }}
    currency: {{ .Values.config.currency | quote }}
    {{- if .Values.config.disclaimer }}
    disclaimer: {{ .Values.config.disclaimer | quote }}
    {{- else }}
    disclaimer: null
    {{- end }}
    departments:
    {{- range .Values.config.departments }}
      {{ . | quote }}:
        roles:
        {{- range .Values.config.roles }}
          {{ . | quote }}:
            seniorityLevels:
            {{- range .Values.config.seniorityLevels }}
              - {{ . }}
            {{- end }}
        {{- end }}
    {{- end }}

{{/* Render the templates */}}
{{ include "bjw-s.common.loader.generate" . }}
