# The atcr.io pull secret is provided by the external-secrets release
# (charts/external-secrets) instead of carrying the password in this chart.
imagePullSecret:
  enabled: true
  storeName: atcr
  credentialsSecret: atcr-pull-credentials
  name: imagepullsecret

absToBookhive:
  # NUXT_APP_SECRET, at least 32 characters. Generate with: openssl rand -base64 32
  appSecret: "TODOCHANGEME"
  # NUXT_ENCRYPTION_KEY, encrypts Audiobookshelf tokens and BookHive keys at
  # rest. Generate with: openssl rand -base64 32
  encryptionKey: "TODOCHANGEME"

app-template:
  controllers:
    abs-to-bookhive:
      # SQLite on a ReadWriteOnce volume and an in-process scheduler: one replica.
      type: deployment
      replicas: 1
      strategy: Recreate
      pod:
        imagePullSecrets:
          - name: imagepullsecret
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
      containers:
        app:
          image:
            repository: atcr.io/maybeanerd.com/abs-to-bookhive
            tag: "v0.1.3"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            NUXT_APP_SECRET:
              secretKeyRef:
                name: abs-to-bookhive
                key: app-secret
            NUXT_ENCRYPTION_KEY:
              secretKeyRef:
                name: abs-to-bookhive
                key: encryption-key

          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: http
                initialDelaySeconds: 15
                periodSeconds: 30
                timeoutSeconds: 10
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: http
                periodSeconds: 15
                timeoutSeconds: 5
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /api/health
                  port: http
                periodSeconds: 5
                failureThreshold: 30

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi

  service:
    app:
      controller: abs-to-bookhive
      ports:
        http:
          port: 3000
          targetPort: http

  ingress:
    app:
      hosts:
        - host: "abs-to-bookhive.bumsco.de"
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: app
                port: http

  persistence:
    data:
      enabled: true
      type: persistentVolumeClaim
      size: 1Gi
      accessMode: ReadWriteOnce
      storageClass: "longhorn"
      globalMounts:
        - path: /app/.data
