apiVersion: v1
kind: Secret
metadata:
  name: attic-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.secrets.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.secretAccessKey | quote }}
  ATTIC_SERVER_TOKEN_RS256_SECRET_BASE64:  {{ .Values.secrets.serverToken | quote }}
