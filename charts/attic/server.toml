listen = "[::]:8080"

# Must match the public URL and end with a slash; attic hands this out to
# clients in `attic login`, so getting it wrong breaks pushes silently.
api-endpoint = "https://attic.cluster.diluz.io/"
allowed-hosts = ["attic.cluster.diluz.io"]

[database]

[storage]
# TODO hetzner bucket settings
type = "s3"
region = "us-east-1"
bucket = "attic"
endpoint = "http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc"

[chunking]
nar-size-threshold = 65536
min-size = 16384
avg-size = 65536
max-size = 262144

[compression]
type = "zstd"

[garbage-collection]
interval = "12 hours"
# Paths not pushed or pulled within this window become GC candidates.
default-retention-period = "1 month"
