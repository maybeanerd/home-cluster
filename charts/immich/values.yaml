immich:
  immich:
    configuration:
      image:
        preview:
          format: webp
        fullsize:
          enabled: true
          format: webp
          quality: 80
      library:
        scan:
          cronExpression: "0 4 * * *"
      machineLearning:
        availabilityChecks:
          enabled: true
          interval: 30000
          timeout: 2000
      metadata:
        faces:
          import: true
      nightlyTasks:
        clusterNewFaces: true
        databaseCleanup: true
        generateMemories: true
        missingThumbnails: true
        startTime: "03:00"
        syncQuotaUsage: true
      notifications:
        smtp:
          enabled: true
          from: "Immich <noreply@diluzio.dev>"
          replyTo: ""
          transport:
            host: "smtp.servivum.com"
            ignoreCert: false
            password: "TODOCHANGEME"
            port: 587
            username: "noreply@diluzio.dev"
      oauth:
        enabled: true
        autoLaunch: true
        autoRegister: true
        buttonText: "Login with Authentik"
        clientId: "x93MIUTyE80epWJKx2ie5yIqqxR2ODPD6aV2vwIS"
        defaultStorageQuota: 10
        issuerUrl: "https://auth.cluster.diluz.io/application/o/immich/"
        timeout: 30000
      passwordLogin:
        enabled: false
      server:
        externalDomain: "https://immich.cluster.diluz.io"
        loginPageMessage: ""
        # not in default at all
        publicUsers: true
      storageTemplate:
        enabled: true
    database:
      storageType: hdd

  persistence:
    external:
      storageClass: nfs-client
      size: 1Ti
      accessMode: ReadWriteOnce
    library:
      existingClaim: data-immich-library-longhorn
    machine-learning-cache:
      storageClass: longhorn
      size: 20Gi
      accessMode: ReadWriteOnce
  defaultPodOptions:
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            preference:
              matchExpressions:
                - key: kubernetes.io/role
                  operator: In
                  values:
                    - worker

  ingress:
    server:
      enabled: true
      hosts:
        - host: immich.cluster.diluz.io
          paths:
            - path: /
              pathType: Prefix

  postgresql:
    auth:
      password: TODOCHANGEME
    primary:
      persistence:
        enabled: true
        existingClaim: "data-immich-postgresql-longhorn"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              preference:
                matchExpressions:
                  - key: kubernetes.io/role
                    operator: In
                    values:
                      - worker
immichframe:
  global:
    fullnameOverride: immichframe

  frameSecrets:
    apiKey: "TODOCHANGEME"
    authenticationSecret: "TODOCHANGEME"

  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/immichframe/immichframe
            tag: v1.0.39.0
            pullPolicy: IfNotPresent
          env:
            TZ: "Europe/Berlin"
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8080
                initialDelaySeconds: 10
                periodSeconds: 30
                timeoutSeconds: 1
                failureThreshold: 3

  secrets:
    config:
      enabled: true
      stringData:
        Settings.yml: |
          General:
            AuthenticationSecret: {{ .Values.frameSecrets.authenticationSecret | quote }}
            UnitSystem: metric
            Interval: 45
            Layout: single
            ImageZoom: false
            ShowClock: true
            ShowProgressBar: true
            ShowPhotoDate: true
            ShowImageDesc: true
            ShowPeopleDesc: true
            ShowAlbumName: true
            ShowImageLocation: true
          Accounts:
            - ImmichServerUrl: "https://immich.cluster.diluz.io"
              ApiKey: {{ .Values.frameSecrets.apiKey | quote }}
              ShowMemories: false
              ShowFavorites: false
              Albums:
                - "ce727154-095e-40d8-b8be-7757792b959a"

  persistence:
    config:
      enabled: true
      type: secret
      identifier: config
      advancedMounts:
        main:
          main:
            - path: /app/Config/Settings.yml
              subPath: Settings.yml
              readOnly: true


  service:
    main:
      controller: main
      ports:
        http:
          port: 8080

  ingress:
    main:
      enabled: true
      hosts:
        - host: immichframe.cluster.diluz.io
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
