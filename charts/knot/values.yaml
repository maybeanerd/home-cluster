imageCredentials:
  registry: atcr.io
  username: "maybeanerd.bumsco.de"
  password: "TODOCHANGEME"

app-template:
  controllers:
    knot:
      type: deployment
      replicas: 1
      pod:
        imagePullSecrets:
          - name: imagepullsecret
        securityContext:
          fsGroup: 1000
          fsGroupChangePolicy: "OnRootMismatch"
      containers:
        app:
          image:
            repository: atcr.io/tangled.org/knot
            tag: v2.0.0

          ports:
            http:
              containerPort: 5555
              protocol: TCP

          env:
            KNOT_SERVER_HOSTNAME: "knot.bumsco.de"
            KNOT_SERVER_OWNER: "did:plc:x5mzoesuejzv73cv2dlcjylg"
            KNOT_SERVER_DB_PATH: /var/data/knotserver.db
            KNOT_BLOBSTORE_PATH: /var/data/blobs
            KNOT_GIT_REPOS_PATH: /var/data/repos
            KNOT_SERVER_INTERNAL_LISTEN_ADDR: localhost:5444

          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: http
                initialDelaySeconds: 10
                periodSeconds: 30
                timeoutSeconds: 10
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: http
                periodSeconds: 15
                timeoutSeconds: 5
            startup:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: http
                periodSeconds: 5
                failureThreshold: 30

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi

  service:
    app:
      controller: knot
      ports:
        http:
          port: 5555
          targetPort: http

  ingress:
    app:
      hosts:
        - host: "knot.bumsco.de"
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: app
                port: http

  persistence:
    data:
      enabled: true
      type: persistentVolumeClaim
      size: 50Gi
      accessMode: ReadWriteOnce
      storageClass: "longhorn"
      globalMounts:
        - path: /var/data
